/* ---------------- Utilities ---------------- */

function createSlug(text) {
  return text ? text.toString().toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '') : '';
}

function showToast(msg, type = "info") {
  const toast = $("toast");
  if (!toast) return;
  toast.innerText = msg;
  toast.className = `toast ${type}`;
  toast.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.style.display = "none"; }, 3500);
}

function waLink(rawWa, message) {
  let waNum = rawWa ? rawWa.replace(/[^0-9]/g, '') : '';
  if (waNum.startsWith('0')) waNum = '62' + waNum.slice(1);
  return waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(message)}` : '#';
}

/* Build the new SEO-friendly hash slug for a business:
   #detail/[slug-kategori]/[slug-wilayah]/[slug-usaha] */
function buildDetailHash(b) {
  const catSlug = createSlug(b.category);
  const wilayahSlug = createSlug(b.city);
  const itemSlug = b.slug || createSlug(b.name);
  return `#detail/${catSlug}/${wilayahSlug}/${itemSlug}`;
}
function buildCategoryHash(category) {
  return `#detail/${createSlug(category)}`;
}

/* ---------------- SEO helpers ---------------- */

const DEFAULT_TITLE = "Laundry Directory — Cari Laundry, Cuci Sepatu & Cleaning Terdekat";
const DEFAULT_DESC = "Temukan tempat laundry kiloan, cuci sepatu, home cleaning, cuci sofa, dan jasa kebersihan terdekat berbasis peta interaktif.";
const DEFAULT_IMG_META = "https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=1200&auto=format&fit=crop&q=80";

function setSEO({ title, desc, image }) {
  const url = window.location.href;
  document.title = title;
  $("seo-title").innerText = title;
  $("seo-desc").setAttribute("content", desc);
  $("seo-canonical").setAttribute("href", url);
  $("og-title").setAttribute("content", title);
  $("og-desc").setAttribute("content", desc);
  $("og-url").setAttribute("content", url);
  $("og-image").setAttribute("content", image || DEFAULT_IMG_META);
}
function resetSEO() {
  setSEO({ title: DEFAULT_TITLE, desc: DEFAULT_DESC, image: DEFAULT_IMG_META });
  $("json-ld-schema").textContent = "";
}
function injectBusinessSEO(b) {
  const imgs = (b.images && b.images.length > 0) ? b.images : [b.imageUrl || DEFAULT_IMG_META];
  const rawPhone = (b.whatsapp || '').toString().trim();
  // Judul: nomor telepon + nama usaha + wilayah (sesuai permintaan)
  const pageTitle = `${rawPhone} ${b.name} ${b.city || ''}`.replace(/\s+/g, ' ').trim();
  const pageDesc = `${b.name} di ${b.city}, ${b.province || ''} melayani ${b.category}. Alamat: ${b.address}. Hubungi WhatsApp dan lihat lokasi peta.`;
  setSEO({ title: pageTitle, desc: pageDesc, image: imgs[0] });
  const schemaData = {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": b.name,
    "image": imgs[0],
    "url": window.location.href,
    "telephone": b.whatsapp,
    "address": { "@type": "PostalAddress", "streetAddress": b.address, "addressLocality": b.city, "addressRegion": b.province || "Indonesia" },
    "geo": { "@type": "GeoCoordinates", "latitude": b.latitude, "longitude": b.longitude }
  };
  $("json-ld-schema").textContent = JSON.stringify(schemaData);
}

/* ---------------- Ads ---------------- */

async function renderAds(prefix) {
  try {
    const snap = await getDocs(collection(db, "advertisements"));
    const ads = [];
    snap.forEach(d => ads.push({ id: d.id, ...d.data() }));
    const top = $("ad-slot-top"), bottom = $("ad-slot-bottom");
    if (top) top.innerHTML = "";
    if (bottom) bottom.innerHTML = "";
    ads.forEach(ad => {
      if (!ad.imageUrl || !ad.linkUrl) return;
      const adHtml = `<a href="${ad.linkUrl}" target="_blank" rel="noopener" class="ad-banner-link"><img src="${ad.imageUrl}" class="ad-banner-img" alt="Iklan Banner"></a>`;
      if (ad.placement === `${prefix}_top` && top) top.innerHTML = adHtml;
      if (ad.placement === `${prefix}_bottom` && bottom) bottom.innerHTML = adHtml;
    });
  } catch (err) { console.error("Ad render error:", err); }
}

/* ---------------- Router ---------------- */

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  return { module: parts[0] || '', params: parts.slice(1) };
}

async function route() {
  const { module, params } = parseHash();
  resetSEO();
  try {
    if (module === '') { await renderHome(); await renderAds('main'); }
    else if (module === 'detail') {
      await renderAds('detail');
      if (params.length === 1) await renderCategoryList(params[0]);
      else if (params.length === 2) await renderCategoryWilayahList(params[0], params[1]);
      else if (params.length >= 3) await renderBusinessDetail(params[0], params[1], params[2]);
      else await renderHome();
    }
    else if (module === 'about') { await renderAds('detail'); renderAbout(); }
    else if (module === 'contact') { await renderAds('detail'); renderContact(); }
    else if (module === 'auth') { await renderAds('detail'); renderAuth(); }
    else if (module === 'admin') { await renderAds('detail'); await renderAdmin(); }
    else { renderNotFound(); }
  } catch (err) {
    console.error(err);
    showToast("Terjadi kesalahan memuat halaman.", "error");
  }
  window.scrollTo(0, 0);
}

async function fetchActiveBusinesses() {
  let snap = await getDocs(query(collection(db, "businesses"), where("status", "==", "active")));
  let list = [];
  snap.forEach(d => list.push({ id: d.id, ...d.data() }));
  if (list.length === 0) {
    const allSnap = await getDocs(collection(db, "businesses"));
    list = [];
    allSnap.forEach(d => list.push({ id: d.id, ...d.data() }));
  }
  return list;
}

async function fetchGalleryImages() {
  try {
    const gSnap = await getDocs(collection(db, "adminGallery"));
    galleryImages = [];
    gSnap.forEach(d => galleryImages.push(d.data().url));
  } catch (e) { /* ignore */ }
}

function businessCardHtml(b, canEditFn) {
  const detailHash = buildDetailHash(b);
  const catHash = buildCategoryHash(b.category);
  const defaultRandom = galleryImages.length > 0 ? galleryImages[Math.floor(Math.random() * galleryImages.length)] : DEFAULT_IMG;
  const displayThumb = (b.images && b.images.length > 0 && b.images[0]) ? b.images[0] : (b.imageUrl || defaultRandom);
  const canEdit = canEditFn ? canEditFn(b) : false;
  return `
    <div class="card" data-id="${b.id}">
      <img src="${displayThumb}" class="card-img" alt="${b.name}">
      <a href="${catHash}" class="badge">${b.category}</a>
      <a href="${detailHash}" class="card-title">${b.name}</a>
      <small style="color:var(--text-muted);">📍 ${b.address}, ${b.city}</small>

}

function attachCardEditHandlers(container, dataList) {

async function renderHome() {

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mainMap);
  mainMarkersGroup = L.layerGroup().addTo(mainMap);
  setTimeout(() => { if (mainMap) mainMap.invalidateSize(); }, 200);

  $("add-data-btn").onclick = onAddBusinessClick;

  } catch (err) {
    $("data-list").innerHTML = `<div class="empty-state" style="color:#ef4444;">Gagal memuat data: ${err.message}</div>`;
  }
}

function applyHomeFilter() {
  const kw = ($("search")?.value || "").toLowerCase().trim();
  homeFiltered = homeRaw.filter(d => `${d.name} ${d.category} ${d.city} ${d.province || ''} ${d.address}`.toLowerCase().includes(kw));
  homeCurrentPage = 1;
  updateHomeMapMarkers();
  renderHomeList();
}

function updateHomeMapMarkers() {
  if (!mainMarkersGroup) return;
  mainMarkersGroup.clearLayers();
  const bounds = [];
  homeFiltered.forEach(d => {
    if (d.latitude && d.longitude) {
      bounds.push([d.latitude, d.longitude]);
      const detailHash = buildDetailHash(d);
      const m = L.marker([d.latitude, d.longitude]);
      m.bindPopup(`<b>${d.name}</b><br>${d.category}<br>📍 ${d.city}<br><a href="${detailHash}">Buka Detail</a>`);
      mainMarkersGroup.addLayer(m);
    }
  });
  if (bounds.length > 0 && mainMap) mainMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
}

function renderHomeList() {
  const listEl = $("data-list");
  listEl.innerHTML = "";
  if (homeFiltered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">Belum ada data usaha terdaftar.</div>`;
    $("pagination").style.display = "none";
    return;
  }
  const totalPages = Math.ceil(homeFiltered.length / PER_PAGE);
  const start = (homeCurrentPage - 1) * PER_PAGE;
  const pageItems = homeFiltered.slice(start, start + PER_PAGE);
  listEl.innerHTML = pageItems.map(b => businessCardHtml(b, canEditBusiness)).join('');
  attachCardEditHandlers(listEl, homeFiltered);
  renderPager($("pagination"), $("p-numbers"), totalPages, homeCurrentPage, (p) => { homeCurrentPage = p; renderHomeList(); },
    { first: 'p-first', prev: 'p-prev', next: 'p-next', last: 'p-last' });
}

function renderPager(container, numbersEl, totalPages, currentPage, onGo, ids) {
  if (totalPages <= 1) { container.style.display = "none"; return; }
  container.style.display = "flex";
  numbersEl.innerHTML = "";
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
    btn.innerText = i;
    btn.onclick = () => onGo(i);
    numbersEl.appendChild(btn);
  }
  $(ids.first).disabled = currentPage === 1;
  $(ids.prev).disabled = currentPage === 1;
  $(ids.next).disabled = currentPage === totalPages;
  $(ids.last).disabled = currentPage === totalPages;
  $(ids.first).onclick = () => onGo(1);
  $(ids.prev).onclick = () => onGo(Math.max(1, currentPage - 1));
  $(ids.next).onclick = () => onGo(Math.min(totalPages, currentPage + 1));
  $(ids.last).onclick = () => onGo(totalPages);
}

  };

  formRegister.onsubmit = async (e) => {
    e.preventDefault();
    if (parseInt($("captcha-answer").value) !== captchaResult) {
      showToast("Jawaban captcha salah!", "error"); generateCaptcha(); return;
    }
    try {
      const email = $("reg-email").value.trim();
      const cred = await createUserWithEmailAndPassword(auth, email, $("reg-password").value);
      await setDoc(doc(db, "users", cred.user.uid), {
        uid: cred.user.uid, name: $("reg-name").value, email, phone: $("reg-phone").value,
        role: "owner", status: "pending", createdAt: serverTimestamp()
      });
      await signOut(auth);
      showToast("Registrasi berhasil! Menunggu approval Admin.", "success");
      setTimeout(() => { tabLogin.click(); }, 1500);
    } catch (err) { showToast("Gagal Registrasi: " + err.message, "error"); generateCaptcha(); }
  };

  generateCaptcha();
}

/* ---------------- ADD/EDIT BUSINESS MODAL ---------------- */

let pickerMap, pickerMarker;
const imgContainer = $("image-inputs-container");
const addImgBtn = $("add-img-col-btn");

addImgBtn.onclick = () => {
  const currentInputs = imgContainer.querySelectorAll(".f-img-input");
  if (currentInputs.length < 3) {
    const newInput = document.createElement("input");
    newInput.type = "url";
    newInput.className = "f-img-input";
    newInput.placeholder = `URL Gambar ${currentInputs.length + 1}`;
    imgContainer.appendChild(newInput);
    if (imgContainer.querySelectorAll(".f-img-input").length >= 3) addImgBtn.style.display = "none";
  }
};

function resetImageInputs(urls = []) {
  imgContainer.innerHTML = "";
  addImgBtn.style.display = "inline-block";
  const count = Math.max(1, urls.length);
  for (let i = 0; i < count && i < 3; i++) {
    const input = document.createElement("input");
    input.type = "url";
    input.className = "f-img-input";
    input.placeholder = `URL Gambar ${i + 1}`;
    input.value = urls[i] || "";
    imgContainer.appendChild(input);
  }
  if (imgContainer.querySelectorAll(".f-img-input").length >= 3) addImgBtn.style.display = "none";
}

function initPickerMap() {
  if (pickerMap) return;
  pickerMap = L.map('picker-map', { maxBounds: INDONESIA_BOUNDS, maxBoundsViscosity: 1.0, minZoom: 5 }).setView([-6.4025, 106.9680], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pickerMap);
  pickerMap.on('click', (e) => { if (INDONESIA_BOUNDS.contains(e.latlng)) setPickerLocation(e.latlng.lat, e.latlng.lng); });
}
function setPickerLocation(lat, lng) {
  $("f-lat").value = lat.toFixed(6);
  $("f-lng").value = lng.toFixed(6);
  if (pickerMarker) pickerMarker.setLatLng([lat, lng]);
  else pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
}

async function onAddBusinessClick() {
  if (!currentUser) { showToast("Silakan login terlebih dahulu.", "warning"); return; }
  if (!isAdminUser) {
    const qUserBusinesses = query(collection(db, "businesses"), where("ownerId", "==", currentUser.uid));
    const userSnap = await getDocs(qUserBusinesses);
    if (!userSnap.empty) { showToast("⚠️ Anda sudah menambahkan 1 listing usaha.", "warning"); return; }
  }
  $("modal-title").innerText = "Tambah Usaha Baru (Pending Approved)";
  $("add-form").reset();
  $("f-id").value = "";
  resetImageInputs([]);
  $("add-modal").classList.add("active");
  setTimeout(() => { initPickerMap(); if (pickerMap) pickerMap.invalidateSize(); }, 200);
}

function openModalForEdit(d) {
  $("modal-title").innerText = isAdminUser ? `Edit Usaha: ${d.name} (Admin)` : "Edit Usaha Milik Anda";
  $("f-id").value = d.id;
  $("f-name").value = d.name;
  $("f-category").value = d.category;
  $("f-province").value = d.province || '';
  $("f-city").value = d.city;
  $("f-address").value = d.address;
  $("f-wa").value = d.whatsapp;
  resetImageInputs(d.images || (d.imageUrl ? [d.imageUrl] : []));
  $("add-modal").classList.add("active");
  setTimeout(() => { initPickerMap(); setPickerLocation(d.latitude, d.longitude); pickerMap.invalidateSize(); }, 200);
}

$("close-modal-btn").onclick = () => $("add-modal").classList.remove("active");

$("add-form").onsubmit = async (e) => {
  e.preventDefault();
  const id = $("f-id").value;
  const name = $("f-name").value;
  const userInputs = imgContainer.querySelectorAll(".f-img-input");
  let userImages = [];
  userInputs.forEach(input => { if (input.value.trim()) userImages.push(input.value.trim()); });
  if (userImages.length === 0) {
    const randomFallback = galleryImages.length > 0 ? galleryImages[Math.floor(Math.random() * galleryImages.length)] : DEFAULT_IMG;
    userImages.push(randomFallback);
  }
  const payload = {
    name,
    slug: createSlug(name),
    category: $("f-category").value,
    province: $("f-province").value,
    city: $("f-city").value,
    address: $("f-address").value,
    images: userImages,
    imageUrl: userImages[0],
    latitude: parseFloat($("f-lat").value),
    longitude: parseFloat($("f-lng").value),
    whatsapp: $("f-wa").value
  };
  try {
    if (id) {
      await updateDoc(doc(db, "businesses", id), payload);
      showToast("Data usaha berhasil diperbarui!", "success");
    } else {
      payload.ownerId = currentUser.uid;
      payload.status = isAdminUser ? "active" : "pending";
      payload.createdAt = serverTimestamp();
      await addDoc(collection(db, "businesses"), payload);
      showToast(isAdminUser ? "Usaha berhasil ditambahkan!" : "Usaha berhasil diajukan!", "success");
    }
    $("add-modal").classList.remove("active");
    const { module } = parseHash();
    if (module === '') renderHome();
  } catch (err) { showToast("Error: " + err.message, "error"); }
};

async function loadAds() {
  const wrapper = $("ads-cards-wrapper");
  if (!wrapper) return;
  try {
    const snap = await getDocs(collection(db, "advertisements"));
    wrapper.innerHTML = "";
    if (snap.empty) { wrapper.innerHTML = "<div>Belum ada materi iklan. Tambahkan iklan baru.</div>"; return; }
    snap.forEach(d => {
      const ad = { id: d.id, ...d.data() };
      const card = document.createElement("div");
      card.className = "admin-item-card";
      card.innerHTML = `
        <div class="admin-item-header"><strong>${ad.placement}</strong><span class="badge-pill badge-active">Aktif</span></div>
        <img src="${ad.imageUrl}" style="width:100%; height:80px; object-fit:cover; border-radius:4px;" alt="Banner">
        <div><small>Link:</small> <a href="${ad.linkUrl}" target="_blank" rel="noopener">${ad.linkUrl}</a></div>
        <div class="admin-item-actions">
          <button class="btn btn-primary" data-edit-ad="${ad.id}">Edit Iklan</button>
          <button class="btn btn-danger" data-del-ad="${ad.id}">Hapus</button>
        </div>`;
      wrapper.appendChild(card);
      card.querySelector(`[data-edit-ad="${ad.id}"]`).onclick = () => {
        $("ad-modal-title").innerText = "Edit Iklan";
        $("ad-id").value = ad.id;
        $("ad-image-url").value = ad.imageUrl;
        $("ad-target-url").value = ad.linkUrl;
        $("ad-placement").value = ad.placement;
        $("ad-modal").classList.add("active");
      };
      card.querySelector(`[data-del-ad="${ad.id}"]`).onclick = async () => {
        await deleteDoc(doc(db, "advertisements", ad.id));
        showToast("Iklan dihapus!", "success");
        loadAds();
      };
    });
  } catch (err) { wrapper.innerHTML = `<div>Gagal memuat iklan: ${err.message}</div>`; }
}

async function loadUsers() {
  const wrapper = $("user-cards-wrapper");
  if (!wrapper) return;
  try {
    const snap = await getDocs(collection(db, "users"));
    wrapper.innerHTML = "";
    if (snap.empty) { wrapper.innerHTML = "<div>Belum ada data user.</div>"; return; }
    let any = false;
    snap.forEach(d => {
      const u = { id: d.id, ...d.data() };
      if (u.role === 'admin') return;
      any = true;
      const item = document.createElement("div");
      item.className = "admin-item-card";
      item.innerHTML = `
        <div class="admin-item-header">
          <strong>${u.name || 'Owner'}</strong>
          <span class="badge-pill ${u.status === 'approved' ? 'badge-active' : 'badge-pending'}">${u.status || 'pending'}</span>
        </div>
        <div><small>Email:</small> ${u.email}</div>
        <div><small>WA:</small> ${u.phone || '-'}</div>
        <div class="admin-item-actions">
          ${u.status !== 'approved' ? `<button class="btn btn-success" data-app-u="${u.id}">Approve User</button>` : ''}
          <button class="btn btn-danger" data-del-u="${u.id}">Hapus</button>
        </div>`;
      wrapper.appendChild(item);
      const appBtn = item.querySelector(`[data-app-u="${u.id}"]`);
      if (appBtn) appBtn.onclick = async () => { await updateDoc(doc(db, "users", u.id), { status: "approved" }); showToast("User approved!", "success"); loadUsers(); };
      item.querySelector(`[data-del-u="${u.id}"]`).onclick = async () => { await deleteDoc(doc(db, "users", u.id)); showToast("User dihapus.", "success"); loadUsers(); };
    });
    if (!any) wrapper.innerHTML = "<div>Belum ada data user.</div>";
  } catch (err) { wrapper.innerHTML = `<div>Gagal memuat user: ${err.message}</div>`; }
}

async function loadBusinesses() {
  try {
    const snap = await getDocs(collection(db, "businesses"));
    adminBusinesses = [];
    snap.forEach(d => adminBusinesses.push({ id: d.id, ...d.data() }));
    renderAdminBusinessList();
  } catch (err) {
    const w = $("business-cards-wrapper");
    if (w) w.innerHTML = `<div>Gagal memuat usaha: ${err.message}</div>`;
  }
}

function renderAdminBusinessList() {
  const wrapper = $("business-cards-wrapper");
  if (!wrapper) return;
  wrapper.innerHTML = "";
  if (adminBusinesses.length === 0) {
    wrapper.innerHTML = "<div>Tidak ada data usaha.</div>";
    $("b-pagination").style.display = "none";
    return;
  }
  const totalPages = Math.ceil(adminBusinesses.length / ADMIN_PER_PAGE);
  if (adminBCurrentPage > totalPages) adminBCurrentPage = totalPages;
  if (adminBCurrentPage < 1) adminBCurrentPage = 1;
  const start = (adminBCurrentPage - 1) * ADMIN_PER_PAGE;
  const pageItems = adminBusinesses.slice(start, start + ADMIN_PER_PAGE);
  pageItems.forEach(b => {
    const item = document.createElement("div");
    item.className = "admin-item-card";
    item.innerHTML = `
      <div class="admin-item-header"><strong>${b.name}</strong><small style="color:var(--primary); font-weight:bold;">${b.category}</small></div>
      <div><small>Lokasi:</small> ${b.city}, ${b.province || ''}</div>
      <div style="margin-top:4px;">
        <label style="font-size:0.8rem; font-weight:bold;">Status Usaha: </label>
        <select id="status-sel-${b.id}" style="padding:4px; border-radius:4px;">
          <option value="active" ${b.status === 'active' ? 'selected' : ''}>Active (Publik)</option>
          <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending (Review)</option>
          <option value="draft" ${b.status === 'draft' ? 'selected' : ''}>Draft</option>
          <option value="inactive" ${b.status === 'inactive' ? 'selected' : ''}>Inactive</option>
        </select>
      </div>
      <div class="admin-item-actions">
        <button class="btn btn-primary" data-save-b="${b.id}">Simpan Status</button>
        <button class="btn btn-danger" data-del-b="${b.id}">Hapus Usaha</button>
      </div>`;
    wrapper.appendChild(item);
    item.querySelector(`[data-save-b="${b.id}"]`).onclick = async () => {
      const newStatus = $(`status-sel-${b.id}`).value;
      await updateDoc(doc(db, "businesses", b.id), { status: newStatus });
      showToast(`Status ${b.name} diubah menjadi ${newStatus}!`, "success");
      loadBusinesses();
    };
    item.querySelector(`[data-del-b="${b.id}"]`).onclick = async () => {
      await deleteDoc(doc(db, "businesses", b.id));
      showToast(`Usaha ${b.name} dihapus.`, "success");
      loadBusinesses();
    };
  });
  renderPager($("b-pagination"), $("bp-numbers"), totalPages, adminBCurrentPage,
    (p) => { adminBCurrentPage = p; renderAdminBusinessList(); },
    { first: 'bp-first', prev: 'bp-prev', next: 'bp-next', last: 'bp-last' });
}

async function loadGallery() {
  try {
    const snap = await getDocs(collection(db, "adminGallery"));
    adminGallery = [];
    snap.forEach(d => adminGallery.push({ id: d.id, ...d.data() }));
    renderAdminGalleryGrid();
  } catch (err) {
    const w = $("gallery-grid-wrapper");
    if (w) w.innerHTML = `<div>Gagal memuat galeri: ${err.message}</div>`;
  }
}

function renderAdminGalleryGrid() {
  const wrapper = $("gallery-grid-wrapper");
  if (!wrapper) return;
  wrapper.innerHTML = "";
  if (adminGallery.length === 0) {
    wrapper.innerHTML = "<div style='grid-column:1/-1;'>Belum ada gambar galeri.</div>";
    $("g-pagination").style.display = "none";
    return;
  }
  const totalPages = Math.ceil(adminGallery.length / ADMIN_PER_PAGE);
  if (adminGCurrentPage > totalPages) adminGCurrentPage = totalPages;
  if (adminGCurrentPage < 1) adminGCurrentPage = 1;
  const start = (adminGCurrentPage - 1) * ADMIN_PER_PAGE;
  const pageItems = adminGallery.slice(start, start + ADMIN_PER_PAGE);
  pageItems.forEach(g => {
    const card = document.createElement("div");
    card.className = "gallery-card";
    card.innerHTML = `<img src="${g.url}" alt="Gallery"><button class="btn btn-danger" style="font-size:0.7rem; padding:2px;" data-del-g="${g.id}">Hapus</button>`;
    wrapper.appendChild(card);
    card.querySelector(`[data-del-g="${g.id}"]`).onclick = async () => {
      await deleteDoc(doc(db, "adminGallery", g.id));
      showToast("Gambar dihapus!", "success");
      loadGallery();
    };
  });
  renderPager($("g-pagination"), $("gp-numbers"), totalPages, adminGCurrentPage,
    (p) => { adminGCurrentPage = p; renderAdminGalleryGrid(); },
    { first: 'gp-first', prev: 'gp-prev', next: 'gp-next', last: 'gp-last' });
}

document.addEventListener("DOMContentLoaded", () => { route(); });
if (document.readyState !== "loading") { route(); }
